[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "powershell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# ADR-14: macOS (Apple Silicon + Intel), Linux (x86_64), Windows.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The release workflow is generated, then trimmed by hand (push-tags-only
# trigger, attest + publish-crates-io jobs, pinned actions, verified dist
# install). dist's freshness check would fail on those edits, so it is
# scoped off for CI scripts only.
allow-dirty = ["ci"]
# GitHub artifact attestations (#325): dist signs build provenance for every
# artifact during `dist build`, so the next release tag carries provenance
# (Scorecard Signed-Releases). Needs `id-token: write` + `attestations: write`
# on the build-local-artifacts job in release.yml.
github-attestations = true
