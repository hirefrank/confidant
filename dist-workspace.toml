[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell", "homebrew"]
# Target platforms to build apps for (Rust target-triple syntax)
# ADR-14 (as amended by #502): macOS (Apple Silicon + Intel), Linux (x86_64).
# Windows users run Confidant under WSL2; no native Windows target.
targets = ["aarch64-apple-darwin", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu"]
# Path that installers should place binaries in
install-path = "CARGO_HOME"
# Where to host releases
hosting = "github"
# Whether to install an updater program
install-updater = false
# The release workflow is generated, then trimmed by hand (push-tags-only
# trigger, attest + publish-crates-io jobs, pinned actions, verified dist
# install). dist's freshness check would fail on those edits, so it is
# scoped off for CI scripts only.
allow-dirty = ["ci"]

# macOS 14 runners are retired on 2026-11-02 and fail during the
# scheduled brownouts before then (actions/runner-images#13518).
# Build Apple Silicon on the current macOS 15 image.
[dist.github-custom-runners]
aarch64-apple-darwin = "macos-15"
