name: CI

# No paths-ignore: this workflow must run on every PR and push to main so
# the required status checks (#326) always report. Docs-only changes are
# detected by the `changes` job below; required jobs then skip their heavy
# steps but still succeed.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  changes:
    name: detect changed files
    runs-on: ubuntu-24.04
    outputs:
      docs_only: ${{ steps.detect.outputs.docs_only }}
      qa_relevant: ${{ steps.detect.outputs.qa_relevant }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: detect docs-only change
        id: detect
        run: |
          # No `set -e`: any failure below falls through to docs_only=false
          # (fail open = run the full suite) so required checks always report.
          #
          # Docs patterns mirror the retired paths-ignore: *.md, docs/*,
          # LICENSE*. A `.md` file is NOT documentation, though, when it sits
          # in a tree that is hash-pinned or embedded in the binary: editing
          # one does not update its pin, and a stale pin only surfaces when a
          # later non-docs change runs the suite. #633 edited
          # packs/personal/SKILL.md plus its vendored and embedded copies
          # without re-pinning; every heavy step was skipped, the jobs
          # reported SUCCESS, and main went red on the next non-docs merge.
          # Never classify these trees as docs, whatever the extension.
          is_docs() {
            case "$1" in
              packs/*|examples/*|testdata/*) return 1 ;;
              crates/confidant-core/pack-manifests/*|crates/confidant-cli/pack-skills/*|crates/confidant-cli/skills/*) return 1 ;;
              *.md|docs/*|LICENSE*) return 0 ;;
              *) return 1 ;;
            esac
          }
          classify() {
            local f seen=false
            while IFS= read -r f; do
              [ -n "$f" ] || continue
              seen=true
              is_docs "$f" || { echo false; return; }
            done
            [ "$seen" = true ] && echo true || echo false
          }
          # Self-test: this job runs on every event (it is never docs-skipped),
          # so a regression in these patterns fails here instead of silently
          # re-opening the hole.
          for f in README.md docs/architecture.md LICENSE; do
            if ! is_docs "$f"; then
              echo "docs-detector self-test: $f should count as docs" >&2
              exit 1
            fi
          done
          for f in packs/personal/SKILL.md packs/personal/README.md \
                   examples/demo-vault/confidant.toml examples/README.md \
                   testdata/golden/check.json \
                   testdata/packs/example-pack/manifest.toml \
                   crates/confidant-core/pack-manifests/personal-0.2/SKILL.md \
                   crates/confidant-cli/pack-skills/personal/SKILL.md \
                   crates/confidant-cli/skills/qmd-search/SKILL.md \
                   Cargo.toml .github/workflows/ci.yml; do
            if is_docs "$f"; then
              echo "docs-detector self-test: $f should NOT count as docs" >&2
              exit 1
            fi
          done
          docs_only=false
          range=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="${{ github.event.pull_request.base.sha }}...HEAD"
          elif [ "${{ github.event_name }}" = "push" ]; then
            range="${{ github.event.before }}...HEAD"
          fi
          if [ -n "$range" ]; then
            files="$(git diff --name-only "$range" 2>/dev/null || true)"
            if [ -n "$files" ]; then
              docs_only="$(printf '%s\n' "$files" | classify)"
            fi
          fi
          echo "docs_only=$docs_only" >> "$GITHUB_OUTPUT"
          # qa smoke runs on a pull request only when the change could affect
          # it (#628): the fixtures/vaults it drives, the script itself, or the
          # workflow. Fail open — if the range cannot be inspected, run it.
          qa_relevant=true
          if [ -n "$range" ] && [ -n "$files" ]; then
            qa_relevant=false
            while IFS= read -r f; do
              case "$f" in
                testdata/*|packs/*|examples/*|.github/scripts/*|.github/workflows/ci.yml)
                  qa_relevant=true; break ;;
              esac
            done <<< "$files"
          fi
          echo "qa_relevant=$qa_relevant" >> "$GITHUB_OUTPUT"
      - name: report what this run covers
        # Reporting only (#636): a docs-only run reports green for the whole
        # matrix while the heavy steps execute nothing, so a reviewer cannot
        # tell "passed" from "skipped". This step reads the classifier's
        # outputs and changes no gate conditions.
        env:
          DOCS_ONLY: ${{ steps.detect.outputs.docs_only }}
          QA_RELEVANT: ${{ steps.detect.outputs.qa_relevant }}
        run: |
          {
            echo "### Change classification"
            echo ""
            echo "| output | value |"
            echo "| --- | --- |"
            echo "| docs_only | $DOCS_ONLY |"
            echo "| qa_relevant | $QA_RELEVANT |"
            if [ "$DOCS_ONLY" = "true" ]; then
              echo ""
              echo "**Skipped gates:** this is a docs-only change, so the fmt, clippy, test, skills smoke and qa smoke steps were skipped and therefore verified nothing in this run."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$DOCS_ONLY" = "true" ]; then
            echo "::notice title=Skipped gates::docs_only=true — test, skills smoke and qa smoke ran no steps on this run"
          else
            echo "::notice title=Change classification::docs_only=false qa_relevant=$QA_RELEVANT"
          fi

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-24.04
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        if: needs.changes.outputs.docs_only != 'true'
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.docs_only != 'true'
      - name: check
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo +1.88 check --workspace --locked
      # Visibility only (#636): say so here too, so a green docs-only check
      # does not read as "verified".
      - name: docs-only skip notice
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "::notice title=Skipped gates::job '${{ github.job }}' ran no steps because this change is docs-only"

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: [changes]
    strategy:
      fail-fast: false
      # Both platforms on every event, including pull requests. macOS used to
      # be main-push-only, and every main-red incident in this stretch was a
      # platform-only failure it found after merge: #560 and #564 (CLI tests)
      # and #581 (a TUI snapshot that embedded a TMPDIR-dependent path).
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        if: needs.changes.outputs.docs_only != 'true'
        with:
          toolchain: "1.99.0"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.docs_only != 'true'
      - name: fmt
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo fmt --all -- --check
      - name: clippy
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: test
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo test --workspace --all-features --locked
      - name: confidant check demo vault
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo run -p confidant-cli --locked -- check --json --no-input --vault examples/demo-vault
      - name: docs-only skip notice
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "::notice title=Skipped gates::job '${{ github.job }}' ran no steps because this change is docs-only"

  skills-smoke:
    name: skills smoke
    runs-on: ubuntu-24.04
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        if: needs.changes.outputs.docs_only != 'true'
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.docs_only != 'true'
      - name: build CLI
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo build -p confidant-cli --locked
      - name: qmd-query allowlist tests
        if: needs.changes.outputs.docs_only != 'true'
        # Drives bin/qmd-query.py with a fake qmd on PATH (no QMD install),
        # so the §12 verification and the one-allowlist-call contract stay
        # covered (#538).
        run: python3 crates/confidant-cli/skills/qmd-search/tests/test_qmd_query.py --cli target/debug/confidant
      - name: docs-only skip notice
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "::notice title=Skipped gates::job '${{ github.job }}' ran no steps because this change is docs-only"

  qa-smoke:
    name: qa smoke
    runs-on: ubuntu-24.04
    needs: [changes]
    # Nightly, manual, and push-to-main; on a pull request only when the change
    # can affect it (fixtures, pack content, the smoke script, or this
    # workflow), so a fixture move cannot break a job that only runs after
    # merge (#628). A sweep is not a gate on ordinary PRs: it is slower than
    # the unit suite, so it stays off the critical path for everything else
    # (see `.agents/skills/qa-sweep/SKILL.md`).
    if: github.event_name != 'pull_request' || needs.changes.outputs.qa_relevant == 'true'
    # Filing the failure alert needs issues:write; every other job keeps the
    # workflow-level `contents: read`.
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        if: needs.changes.outputs.docs_only != 'true'
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.docs_only != 'true'
      - name: build CLI
        if: needs.changes.outputs.docs_only != 'true'
        # --all-features enables `test-overrides`, so the smoke can use
        # throwaway keys via env instead of a real keychain (ADR-14).
        run: cargo build -p confidant-cli --locked --all-features
      - name: end-to-end smoke
        if: needs.changes.outputs.docs_only != 'true'
        # Drives the built binary through the deterministic subset of the
        # sweep protocol: writes, refusal invariants, read-path privacy,
        # pack lifecycle. `tee` keeps the output for the failure alert below;
        # pipefail keeps this step's exit status that of the smoke, not tee.
        run: |
          set -o pipefail
          python3 .github/scripts/qa-smoke.py --cli target/debug/confidant 2>&1 | tee qa-smoke.log
      - name: docs-only skip notice
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "::notice title=Skipped gates::job '${{ github.job }}' ran no steps because this change is docs-only"
      # A red night must land on the queue a human already watches, without
      # filing a new issue every time. The alert updates one `qa-found` issue
      # in place, and only for `main`: a manual dispatch on a branch cannot
      # open or clear the alert for main. `!cancelled()` keeps a concurrency
      # cancellation from filing an issue (#625).
      - name: report failure
        if: failure() && !cancelled() && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/qa-alert.sh report --log qa-smoke.log
      - name: clear failure alert
        # A green run closes the alert. The docs-only skip also applies here:
        # a docs-only push did not run the smoke and must not clear a real red.
        if: success() && !cancelled() && github.ref == 'refs/heads/main' && needs.changes.outputs.docs_only != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: .github/scripts/qa-alert.sh clear

  deny:
    name: cargo deny
    runs-on: ubuntu-24.04
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        if: needs.changes.outputs.docs_only != 'true'
        with:
          command: check
      - name: docs-only skip notice
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "::notice title=Skipped gates::job '${{ github.job }}' ran no steps because this change is docs-only"

  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    needs: [changes]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f
        if: needs.changes.outputs.docs_only != 'true'
        with:
          toolchain: "1.99.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.docs_only != 'true'
      - uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        if: needs.changes.outputs.docs_only != 'true'
        with:
          tool: cargo-audit
      - name: cargo audit
        if: needs.changes.outputs.docs_only != 'true'
        run: cargo audit
      - name: docs-only skip notice
        if: needs.changes.outputs.docs_only == 'true'
        run: echo "::notice title=Skipped gates::job '${{ github.job }}' ran no steps because this change is docs-only"

  package-paths:
    name: crate path check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: self-test crate path check
        # Exercises the check against a fixture tree (positive and negative
        # cases) so it can't silently regress to always-pass (#377).
        run: python3 .github/scripts/check-crate-paths.py --self-test
      - name: check crate paths
        # Pure-Python, no toolchain: always runs, even for docs-only PRs.
        # Catches build-time paths that escape the crate directory
        # (include_dir!/include_str! with ../..), which break `cargo publish`
        # because the packaged tarball only contains the crate's own files
        # (#367; `cargo package` can't catch this in CI pre-release because
        # it resolves sibling crates against the crates.io index).
        run: python3 .github/scripts/check-crate-paths.py
