# cargo-deny configuration for Confidant.
# Licenses must stay compatible with the Apache-2.0 project license.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0370/-0371/-0372: zvariant, zbus_names and
    # zvariant_derive are unmaintained standalone crates (merged into
    # zbus 6). They reach us only through keyring -> zbus -> zvariant,
    # which carries the Linux Secret Service keychain backend, so they
    # stay out of every runtime crypto and data path. No safe upgrade
    # exists: keyring 3.6 pins zbus 4, and keyring 4 still asks for
    # zbus 5, whose zvariant 5 is flagged the same way. Re-evaluate
    # when the Secret Service backend moves to zbus 6.
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
    # RUSTSEC-2026-0374: basic-toml is unmaintained (the repository was
    # archived). It reaches us only through age 0.12.1 ->
    # i18n-embed/i18n-config, a build-time localization dependency, not a
    # runtime crypto or data path. age 0.12.1 is the latest release and has
    # no safe upgrade; re-evaluate when age updates that dependency.
    "RUSTSEC-2026-0374",
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "CC0-1.0", # age, bip39 (public-domain dedication; compatible with Apache-2.0)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
