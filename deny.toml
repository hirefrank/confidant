# cargo-deny configuration for Confidant.
# Licenses must stay compatible with the Apache-2.0 project license.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0173: proc-macro-error2 (via i18n-embed-fl <- age) is
    # unmaintained. It is a compile-time proc-macro used only for age's
    # localized error messages; it has no effect on runtime crypto.
    # No safe upgrade exists (age 0.11 pins it); re-evaluate on age 0.12.
    "RUSTSEC-2026-0173",
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "CC0-1.0", # age, bip39 (public-domain dedication; compatible with Apache-2.0)
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
