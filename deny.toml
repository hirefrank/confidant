# cargo-deny configuration for Confidant.
# Licenses must stay compatible with the Apache-2.0 project license.

[graph]
all-features = true
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "aarch64-unknown-linux-gnu" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]

[advisories]
version = 2
yanked = "deny"
ignore = [
    # RUSTSEC-2026-0543: chrono is unmaintained (all versions, no patched
    # release). It is a direct dependency of confidant-core and
    # confidant-cli for date parsing and `Utc::now`, so it is on the
    # record-writing path rather than a leaf we can drop. This is an
    # informational "unmaintained" advisory, not a vulnerability, and
    # cargo-deny offers no safe upgrade. Re-evaluate when chrono resumes
    # maintenance; the durable fix is migrating to jiff or time, which is
    # its own change and not a CI unblock.
    "RUSTSEC-2026-0543",
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "CC0-1.0", # public-domain dedication; compatible with Apache-2.0
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
