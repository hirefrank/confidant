[workspace]
resolver = "2"
# fuzz/ is its own cargo-fuzz workspace (see fuzz/Cargo.toml); keep
# libfuzzer-sys/arbitrary out of the main dependency graph (MSRV/deny).
exclude = ["fuzz"]
members = [
    "crates/confidant-core",
    "crates/confidant-cli",
    "crates/confidant-tui",
]
default-members = [
    "crates/confidant-core",
    "crates/confidant-cli",
    "crates/confidant-tui",
]

[workspace.package]
version = "0.7.2"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/hirefrank/confidant"
homepage = "https://github.com/hirefrank/confidant"
authors = ["Frank Harris"]
description = "Relationship memory you own: plain-text records in a git repo, for one operator and their agents."

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4.38", default-features = false, features = ["alloc", "std", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
confidant-core = { path = "crates/confidant-core", version = "0.7.2" }
crossterm = "0.29"
include_dir = "0.7"
ratatui = "0.30"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
tempfile = "3.13"
toml = "1.1.8"
toml_edit = "0.25"
# Sync HTTP client for the `doctor` staleness check (#165). No async
# runtime; rustls (ring provider) + webpki roots, and gzip is left off so
# the tree stays small (GitHub's API returns identity when not asked for
# compression). MSRV 1.88, matching the workspace.
ureq = { version = "3.4", default-features = false, features = ["rustls"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
