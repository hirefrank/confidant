[workspace]
resolver = "2"
members = [
    "crates/confidant-core",
    "crates/confidant-cli",
    "crates/confidant-crypt",
]
default-members = [
    "crates/confidant-core",
    "crates/confidant-cli",
    "crates/confidant-crypt",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/hirefrank/confidant"
homepage = "https://github.com/hirefrank/confidant"
authors = ["Frank Harris"]
description = "A plain-text, git-native CRM for one operator and their agents."

[workspace.dependencies]
anyhow = "1.0"
base64 = "0.22"
bech32 = "0.9"
bip39 = { version = "3.0", default-features = false, features = ["std", "rand", "zeroize"] }
chacha20poly1305 = "0.10"
chrono = { version = "0.4.38", default-features = false, features = ["alloc", "std", "clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
confidant-core = { path = "crates/confidant-core", version = "0.1.0" }
confidant-crypt = { path = "crates/confidant-crypt", version = "0.1.0" }
age = { version = "0.11", default-features = false, features = ["armor"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
getrandom = "0.2"
hkdf = "0.12"
hmac = "0.12"
# OS keychain backends (keyring 3.6 has no default features — without these
# it falls back to an in-memory mock). `dep:`-gated per platform, so all
# are safe to enable unconditionally: macOS → Keychain Services,
# Linux → Secret Service. The async backend is pure-Rust zbus exposed
# through a blocking wrapper (no system libdbus needed); crypto-rust
# avoids an OpenSSL dep.
keyring = { version = "3.6", features = ["apple-native", "async-secret-service", "crypto-rust"] }
rand = "0.8"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.13"
thiserror = "2.0"
toml = "0.8.19"
unicode-normalization = "0.1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
zeroize = { version = "1.8", features = ["derive"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
