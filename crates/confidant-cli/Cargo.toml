[package]
name = "confidant-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "CLI for Confidant, relationship memory you own."
readme = "README.md"

[[bin]]
name = "confidant"
path = "src/main.rs"

[package.metadata.dist]
# The binary ships via GitHub Releases (cargo-dist) AND as a crates.io
# package (#39): `cargo install confidant-cli` installs the `confidant`
# binary. (The package keeps the `-cli` suffix; renaming it to `confidant`
# would churn manifests, lockfile, docs, and CI for no functional gain.)
dist = true

[dependencies]
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
confidant-core.workspace = true
include_dir.workspace = true
serde.workspace = true
serde_json.workspace = true
# `pack add` fetches into a temp dir (#439); already licensed and in the
# lockfile as a dev-dependency, promoted so the shipped command can use it.
tempfile.workspace = true
toml.workspace = true
ureq.workspace = true

[features]
# Test-only env-var overrides (CONFIDANT_TEST_EXE_PATH,
# CONFIDANT_TEST_COMMAND_RECORDER, CONFIDANT_TEST_RELEASES_URL). Never
# enabled in release builds: CI's --all-features turns it on for the test
# suite, and the release binary is built without it.
test-overrides = []

[dev-dependencies]
toml.workspace = true
serde_json.workspace = true
