[package]
name = "confidant-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "CLI for Confidant, relationship memory you own."
readme = "README.md"

[[bin]]
name = "confidant"
path = "src/main.rs"

[package.metadata.dist]
# The binary ships via GitHub Releases (cargo-dist) AND as a crates.io
# package (#39): `cargo install confidant-cli` installs the `confidant`
# binary. (The package keeps the `-cli` suffix; renaming it to `confidant`
# would churn manifests, lockfile, docs, and CI for no functional gain.)
dist = true

[dependencies]
age.workspace = true
anyhow.workspace = true
chrono.workspace = true
clap.workspace = true
confidant-core.workspace = true
confidant-crypt.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
include_dir.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
ureq.workspace = true
zeroize.workspace = true

[features]
# Test-only env-var overrides (CONFIDANT_TEST_DEVICE_KEY). Never enabled
# in release builds: CI's --all-features turns it on for the test suite,
# and the release binary is built without it, so the override cannot
# bypass the fresh-device check in production.
test-overrides = []

[dev-dependencies]
age.workspace = true
toml.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
rand.workspace = true
serde_json.workspace = true
tempfile.workspace = true
