[package]
name = "confidant-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "CLI for the Confidant plain-text CRM."
publish = false

[[bin]]
name = "confidant"
path = "src/main.rs"

[package.metadata.dist]
# The binary ships via GitHub Releases (cargo-dist); it is not published to
# crates.io as a package (publish = false stays).
dist = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
confidant-core.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true
tempfile.workspace = true
