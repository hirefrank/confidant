[package]
name = "confidant-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Terminal UI for Confidant, consuming the ADR-7 CLI JSON contract."
publish = false

[[bin]]
name = "confidant-tui"
path = "src/main.rs"

[package.metadata.dist]
# #218: the TUI ships as a GitHub-Releases binary only — it stays a preview
# (`publish = false`, no crates.io yet, and it deliberately never links
# confidant-core so it remains the second consumer of the ADR-7 --json
# contract). `dist = true` opts the binary into cargo-dist despite
# `publish = false`, so the release workflow produces `confidant-tui`
# alongside `confidant`. Phase 2 (write flows) landed in #211; flipping to
# crates.io still tracks #218.
dist = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
libc = "0.2"
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
