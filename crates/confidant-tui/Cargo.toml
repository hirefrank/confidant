[package]
name = "confidant-tui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
description = "Terminal UI for Confidant, consuming the ADR-7 CLI JSON contract."
readme = "README.md"

[[bin]]
name = "confidant-tui"
path = "src/main.rs"

[package.metadata.dist]
# The TUI ships both as a GitHub-Releases binary (cargo-dist) and on
# crates.io (#363). It deliberately never links confidant-core so it
# remains the second consumer of the ADR-7 --json contract. `dist = true`
# opts the binary into cargo-dist, so the release workflow produces
# `confidant-tui` alongside `confidant`.
dist = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
crossterm.workspace = true
libc = "0.2"
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true

[dev-dependencies]
tempfile.workspace = true
